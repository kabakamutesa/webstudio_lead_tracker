<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lead Tracker</title>
<style>
:root{--bg:#eef1f5;--card:#fff;--ink:#131a2b;--mut:#657089;--line:#dbe0ea;--acc:#2457d6;--on:#fff;--warn:#c2410c;--warnb:#fdeadd}
@media(prefers-color-scheme:dark){:root{--bg:#0e1320;--card:#161d2e;--ink:#e8ecf5;--mut:#93a0ba;--line:#26304a;--acc:#7aa2ff;--on:#0b1020;--warn:#ff9a6b;--warnb:#33201a}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:22px 16px 70px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
header>.row{justify-content:flex-end}
@media(max-width:560px){
.wrap{padding:12px 10px 40px}
header{align-items:flex-start}
header h1{width:100%}header>.row{width:100%;display:grid;grid-template-columns:1fr 1fr}header>.row .pri{grid-column:1/-1}
.tools{display:grid!important;grid-template-columns:1fr 1fr}.tools input{grid-column:1/-1;width:100%}.tools select{width:100%;min-width:0}
.tabs{overflow-x:auto}.tab{white-space:nowrap}.lead{align-items:flex-start}.lead>div:first-child{width:100%}.acts{width:100%;flex-wrap:wrap}.acts .sm{flex:1 1 auto}
.g{grid-template-columns:1fr!important}dialog{width:calc(100vw - 20px);max-height:calc(100vh - 20px);padding:14px}.chip{min-height:36px}
#dbody .row{align-items:stretch}#dbody input,#dbody select,#dbody textarea{max-width:100%}
}
h1{font:700 30px/1 Georgia,"Times New Roman",serif;margin:0;letter-spacing:-.02em}
h1 small{display:block;font:400 13px system-ui,sans-serif;color:var(--mut);margin-top:6px;letter-spacing:0}
h2{font:700 21px Georgia,serif;margin:0 0 12px}
button,select,input,textarea{font:inherit;color:inherit}
input,select,textarea{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn,.sm{border:1px solid var(--line);background:var(--card);border-radius:8px;cursor:pointer;text-decoration:none;color:var(--ink);display:inline-block}
.btn{padding:8px 13px}.sm{padding:5px 10px;font-size:13px;border-radius:7px}
.btn:hover,.sm:hover{border-color:var(--mut)}
.pri,.wa{background:var(--acc);color:var(--on);border-color:var(--acc);font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.note{background:var(--warnb);color:var(--warn);padding:9px 13px;border-radius:9px;margin-bottom:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13px;text-transform:capitalize}
.chip b{margin-left:6px;color:var(--mut)}
.chip.on{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tab{background:none;border:0;padding:9px 14px;cursor:pointer;color:var(--mut);border-bottom:3px solid transparent;margin-bottom:-1px;font-weight:600}
.tab.on{color:var(--ink);border-color:var(--acc)}
.tab b{background:var(--acc);color:var(--on);border-radius:99px;padding:0 7px;font-size:12px;margin-left:4px}
.tools{margin-bottom:12px}.tools input{flex:1;min-width:160px}
.sec{font-weight:700;margin:20px 0 8px}
.sec span{color:var(--mut);font-weight:400}
.lead{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:8px;cursor:pointer}
.lead.od{border-left-color:var(--warn)}
.lead:hover{border-color:var(--mut)}
.nm{font-weight:700}
.meta{color:var(--mut);font-size:13px}
.late{color:var(--warn);font-weight:600;font-size:13px}
.pill{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:500;margin-left:6px;text-transform:capitalize}
.acts{display:flex;gap:6px}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);padding:20px;width:min(660px,94vw);max-height:92vh}
dialog::backdrop{background:#000a}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.g{grid-template-columns:1fr}}
#dbody label{display:block;font-size:12px;color:var(--mut)}
#dbody .g input,#dbody .g select,#dbody textarea{width:100%;margin-top:3px;color:var(--ink)}
.tl{border-left:2px solid var(--line);margin:6px 0 0 5px;padding-left:12px}
.tl>div{margin-bottom:10px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:9px;z-index:9}
.ic{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;padding:0;border:1px solid var(--line);border-radius:8px;background:var(--card);cursor:pointer;color:var(--ink);text-decoration:none}
.ic svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic.ok{color:var(--acc)}.ic.wa{background:#25d366;border-color:#25d366;color:#fff}.ic.del:hover{color:var(--warn);border-color:var(--warn)}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
</style></head><body><div class="wrap">
<header><h1>Lead Tracker<small>Kabaka Web Studio · saved to your database</small></h1>
<div class="row"><button class="btn" id="tplb">Message template</button><button class="btn" id="impb">Import</button><input type="file" id="imp" accept=".json,.csv,text/csv" hidden><button class="btn" id="exp">Export backup</button><button class="btn pri" id="add">Add lead</button></div></header>
<div class="note" id="bk" hidden><span>Your leads are saved in your database. Export a copy now and then as an extra backup.</span><button class="sm" id="bkb">Export now</button></div>
<div class="chips" id="chips"></div>
<div class="tabs"><button class="tab" data-v="today">Today <b id="tdc">0</b></button><button class="tab" data-v="all">All leads</button></div>
<div class="row tools" id="tools" hidden><input id="q" placeholder="Search name, niche, phone, notes…"><select id="fs"></select><select id="fn"></select><select id="fo"><option value="next">Sort: follow-up date</option><option value="new">Sort: newest</option><option value="name">Sort: name</option></select></div>
<div id="main"></div></div>
<dialog id="dlg"><div id="dbody"></div></dialog><div id="toast" hidden></div>
<script>
const KEY='kws_leads_v1',S=['new','contacted','replied','pending','won','lost'],
H={new:210,contacted:45,replied:170,pending:25,won:140,lost:0},
CH=['WhatsApp','Call','Email','TikTok','Instagram','Visit','Other'];
let db={leads:[],tpl:'Hi {name}, Kabaka here from Kabaka Web Studio in Nairobi. Just following up on the website idea I shared. Do you have a few minutes this week to look at it?',lastBackup:null},v='today',f={q:'',s:'',n:'',o:'next'},cur=null;
const DEFNEW='Hi {name}, this is Kabaka from Kabaka Web Studio in Nairobi. I help local businesses get more customers online with a professional website, and I put together a quick concept for {name}. Can I send it over?';
let snap={},ssnap='',busy=false,again=false;
const fixS=()=>db.leads.forEach(l=>{if(l.status==='negotiating')l.status='pending';if(l.status==='demo')l.status='replied'});
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toLocaleDateString('en-CA'),addDays=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.toLocaleDateString('en-CA')},
uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6),isOpen=l=>l.status!=='won'&&l.status!=='lost',
ago=t=>{if(!t)return'never';const d=Math.floor((Date.now()-t)/864e5);return d<1?'today':d===1?'yesterday':d+'d ago'};
async function persist(){if(busy){again=true;return}busy=true;
try{const cur={};db.leads.forEach(l=>cur[l.id]=JSON.stringify(l));
const up=db.leads.filter(l=>snap[l.id]!==cur[l.id]),del=Object.keys(snap).filter(i=>!(i in cur)),st={tpl:db.tpl,tplNew:db.tplNew,lastBackup:db.lastBackup},sj=JSON.stringify(st);
if(up.length||del.length||sj!==ssnap){const r=await fetch('/api/app?a=save',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({up,del,st})});
if(r.status===401){busy=false;return boot()}if(!r.ok)throw 0;snap=cur;ssnap=sj}}
catch(e){toast('NOT SAVED. Check your connection; it retries on your next change.')}finally{busy=false}
if(again){again=false;persist()}}
async function boot(){try{const r=await fetch('/api/app?a=load');if(r.status===401)return loginView();if(!r.ok)throw 0;const d=await r.json();
db.leads=d.leads;Object.assign(db,d.settings);db.tplNew=db.tplNew||DEFNEW;fixS();snap={};db.leads.forEach(l=>snap[l.id]=JSON.stringify(l));
ssnap=JSON.stringify({tpl:db.tpl,tplNew:db.tplNew,lastBackup:db.lastBackup});render()}
catch(e){$('#main').innerHTML='<div class="empty">Could not load your leads. Check your connection and reload.</div>'}}
function loginView(){$('#tools').hidden=true;$('#chips').innerHTML='';$('#main').innerHTML='<div class="empty"><h2>Sign in</h2><input id="pw" type="password" placeholder="Password" style="max-width:260px"> <button class="btn pri" id="lg">Sign in</button></div>';
$('#lg').onclick=async()=>{const r=await fetch('/api/app?a=login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:$('#pw').value})});if(r.ok)boot();else toast('Wrong password')};
$('#pw').onkeydown=e=>{if(e.key==='Enter')$('#lg').click()};$('#pw').focus()}
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.i);toast.i=setTimeout(()=>t.hidden=true,3200)}
function wa(l){let p=String(l.phone||'').replace(/\D/g,'');if(!p)return'';if(p[0]==='0')p='254'+p.slice(1);else if(p.length===9)p='254'+p;return'https://wa.me/'+p+'?text='+encodeURIComponent((l.status==='new'?db.tplNew:db.tpl).replace(/\{name\}/g,l.name))}
const pill=s=>`<span class="pill" style="background:hsl(${H[s]} 70% 50%/.22)">${s}</span>`;
const I={tick:'<svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>',wa:'<svg viewBox="0 0 24 24"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>',del:'<svg viewBox="0 0 24 24"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M10 11v6M14 11v6"/></svg>'};
const NEXT={contacted:[['replied','Replied'],['won','Won'],['lost','Lost']],replied:[['pending','Pending'],['won','Won'],['lost','Lost']],pending:[['won','Won'],['lost','Lost']]};
function row(l){const t=today(),late=l.next&&l.next<t&&isOpen(l),w=wa(l),nw=l.status==='new',
info=[l.phone,l.niche,l.location,l.source&&l.source!=='import'?l.source:''].filter(Boolean).map(esc).join(' · ');
return`<div class="lead ${late?'od':''}" data-id="${l.id}"><div><div class="nm">${esc(l.name)}${pill(l.status)}</div><div class="meta">${info}${info?' · ':''}last contact ${ago(l.last)}</div><div>${l.next?`<span class="${late?'late':'meta'}">${late?'Overdue since ':'Follow up '}${l.next}</span>`:isOpen(l)&&!nw?'<span class="meta">No follow-up set</span>':''}</div></div><div class="acts">${nw?`<button class="ic ok" data-tick="${l.id}" title="Mark as contacted">${I.tick}</button>`:''}${w?`<a class="ic wa" href="${w}" target="_blank" rel="noopener" data-x title="WhatsApp">${I.wa}</a>`:''}${(NEXT[l.status]||[]).map(([k,lab])=>`<button class="sm" data-mv="${l.id}|${k}">${lab}</button>`).join('')}${nw?'':`<button class="sm" data-log="${l.id}">Log</button>`}${nw?`<button class="ic del" data-del="${l.id}" title="Delete lead">${I.del}</button>`:''}</div></div>`}
function mark(id,k){const l=db.leads.find(x=>x.id===id);if(!l)return;const from=l.status;l.status=k;
if(k==='contacted'&&from==='new'){l.last=Date.now();l.log.push({t:Date.now(),ch:'Outreach',text:'First outreach sent'});if(!l.next)l.next=addDays(3)}
else l.log.push({t:Date.now(),ch:'Status',text:'Moved to '+k});
if(k==='won'||k==='lost')l.next='';persist();render();toast(l.name+' moved to '+k)}
const sec=(t,a)=>a.length?`<div class="sec">${t} <span>${a.length}</span></div>`+a.map(row).join(''):'';
function render(){const L=db.leads,t=today(),act=L.filter(isOpen),byN=(a,b)=>(a.next||'9').localeCompare(b.next||'9');
$('#chips').innerHTML=S.map(s=>`<button class="chip ${v==='all'&&f.s===s?'on':''}" data-s="${s}">${s}<b>${L.filter(l=>l.status===s).length}</b></button>`).join('');
document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
$('#tdc').textContent=act.filter(l=>l.next&&l.next<=t).length;
$('#bk').hidden=!(L.length&&(!db.lastBackup||Date.now()-db.lastBackup>6048e5));
$('#tools').hidden=v!=='all';
const ns=[...new Set(L.map(l=>l.niche).filter(Boolean))].sort();
$('#fs').innerHTML='<option value="">All statuses</option>'+S.map(s=>`<option ${f.s===s?'selected':''}>${s}</option>`).join('');
$('#fn').innerHTML='<option value="">All niches</option>'+ns.map(n=>`<option ${f.n===n?'selected':''}>${esc(n)}</option>`).join('');
$('#fo').value=f.o;
let h='';
if(!L.length)h='<div class="empty">No leads yet. Add your first lead, or import a CSV exported from your spreadsheet.</div>';
else if(v==='today'){h=sec('Overdue',act.filter(l=>l.next&&l.next<t).sort(byN))+sec('Due today',act.filter(l=>l.next===t))+sec('No follow-up set',act.filter(l=>!l.next))+sec('Upcoming',act.filter(l=>l.next&&l.next>t).sort(byN));
if(!h)h='<div class="empty">All clear. Nothing needs a follow-up.</div>'}
else{const q=f.q.toLowerCase();let a=L.filter(l=>(!f.s||l.status===f.s)&&(!f.n||l.niche===f.n)&&(!q||[l.name,l.niche,l.phone,l.location,l.notes,l.source].join(' ').toLowerCase().includes(q)));
a.sort({next:(x,y)=>(isOpen(y)-isOpen(x))||byN(x,y),new:(x,y)=>y.created-x.created,name:(x,y)=>x.name.localeCompare(y.name)}[f.o]);
h=`<div class="meta" style="margin-bottom:8px">${a.length} of ${L.length} leads</div>`+(a.map(row).join('')||'<div class="empty">No leads match these filters.</div>')}
$('#main').innerHTML=h}
function logHtml(l){return`<div class="sec">Log a contact</div><div class="row"><select id="lc">${CH.map(c=>`<option>${c}</option>`).join('')}</select><input id="lt" placeholder="What did you send, and what did they say?" style="flex:1;min-width:180px"></div><div class="row" style="margin-top:8px"><span class="meta">Next follow-up:</span>${[1,3,7,14].map(n=>`<button class="sm" data-fu="${n}">+${n}d</button>`).join('')}<button class="btn pri" id="ad" style="margin-left:auto">Add to timeline</button></div><div class="sec">Timeline</div><div class="tl">${l.log.length?l.log.slice().reverse().map(e=>`<div><div class="meta">${new Date(e.t).toLocaleString('en-GB',{dateStyle:'medium',timeStyle:'short'})} · ${esc(e.ch)}</div>${esc(e.text)}</div>`).join(''):'<div class="meta">No contact logged yet.</div>'}</div>`}
function openLead(id,foc){cur=id?db.leads.find(l=>l.id===id):{id:null,name:'',niche:'',phone:'',email:'',website:'',location:'',source:'',status:'new',next:'',notes:'',log:[]};const l=cur,
fld=(k,lab,ty='text')=>`<label>${lab}<input name="${k}" type="${ty}" value="${esc(l[k])}"></label>`;
$('#dbody').innerHTML=`<h2>${l.id?esc(l.name):'New lead'}</h2><div class="g">${fld('name','Business or contact name *')}${fld('niche','Niche (salon, movers…)')}${fld('phone','Phone / WhatsApp')}${fld('email','Email','email')}${fld('website','Website or social link')}${fld('location','Location')}${fld('source','Source (TikTok, walk-in…)')}<label>Status<select name="status">${S.map(s=>`<option ${s===l.status?'selected':''}>${s}</option>`).join('')}</select></label>${fld('next','Next follow-up','date')}</div><label style="margin-top:10px">Notes<textarea name="notes" rows="3" style="width:100%;margin-top:3px">${esc(l.notes)}</textarea></label><div class="row" style="margin-top:12px"><button class="btn pri" id="sv">Save</button><button class="btn" id="cl">Close</button>${l.id?'<button class="btn" id="del" style="margin-left:auto;color:var(--warn)">Delete lead</button>':''}</div>${l.id?logHtml(l):''}`;
if(!$('#dlg').open)$('#dlg').showModal();if(foc&&$('#lt'))$('#lt').focus()}
function save1(){const o={};document.querySelectorAll('#dbody [name]').forEach(e=>o[e.name]=e.value.trim());
if(!o.name){toast('Add a name first');return false}Object.assign(cur,o);
if(!cur.id){cur.id=uid();cur.created=Date.now();db.leads.push(cur)}persist();render();return true}
$('#dbody').onclick=e=>{const i=e.target.id,fu=e.target.dataset.fu;
if(fu){document.querySelector('[name=next]').value=addDays(+fu)}
else if(i==='sv'){if(save1())$('#dlg').close()}
else if(i==='cl')$('#dlg').close();
else if(i==='impgo')doImport();
else if(i==='del'){if(confirm('Delete '+cur.name+' and its timeline?')){db.leads=db.leads.filter(l=>l.id!==cur.id);persist();render();$('#dlg').close()}}
else if(i==='ad'){const tx=$('#lt').value.trim();if(!tx){toast('Write a short note first');return}if(!save1())return;
cur.log.push({t:Date.now(),ch:$('#lc').value,text:tx});cur.last=Date.now();if(cur.status==='new')cur.status='contacted';persist();render();openLead(cur.id,true);toast('Added to timeline')}};
$('#main').onclick=e=>{const T=e.target,tk=T.closest('[data-tick]'),mv=T.closest('[data-mv]'),dl=T.closest('[data-del]'),lg=T.closest('[data-log]');
if(tk)return mark(tk.dataset.tick,'contacted');if(mv){const[i,k]=mv.dataset.mv.split('|');return mark(i,k)}
if(dl){const l=db.leads.find(x=>x.id===dl.dataset.del);if(l&&confirm('Permanently delete '+l.name+'? This cannot be undone.')){db.leads=db.leads.filter(x=>x!==l);persist();render()}return}
if(lg)return openLead(lg.dataset.log,true);if(T.closest('[data-x]'))return;const r=T.closest('.lead');if(r)openLead(r.dataset.id)};
$('#chips').onclick=e=>{const c=e.target.closest('[data-s]');if(!c)return;v='all';f.s=f.s===c.dataset.s?'':c.dataset.s;render()};
document.querySelector('.tabs').onclick=e=>{const t=e.target.closest('.tab');if(t){v=t.dataset.v;render()}};
$('#q').oninput=e=>{f.q=e.target.value;render()};
$('#fs').onchange=e=>{f.s=e.target.value;render()};$('#fn').onchange=e=>{f.n=e.target.value;render()};$('#fo').onchange=e=>{f.o=e.target.value;render()};
$('#add').onclick=()=>openLead(null);
$('#tplb').onclick=()=>{const a=prompt('FIRST OUTREACH message (used for new leads). Use {name}:',db.tplNew);if(a!==null&&a.trim())db.tplNew=a;const b=prompt('FOLLOW-UP message (used once contacted). Use {name}:',db.tpl);if(b!==null&&b.trim())db.tpl=b;persist();toast('Templates saved')};
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,1)],{type:'application/json'}));a.download='leads-backup-'+today()+'.json';a.click();db.lastBackup=Date.now();persist();render()}
$('#exp').onclick=exp;$('#bkb').onclick=exp;
function parseCsv(t,d){const r=[];let w=[],c='',q=0;for(let i=0;i<t.length;i++){const h=t[i];if(q){if(h==='"'){if(t[i+1]==='"'){c+='"';i++}else q=0}else c+=h}else if(h==='"')q=1;else if(h===d){w.push(c);c=''}else if(h==='\n'||h==='\r'){if(h==='\r'&&t[i+1]==='\n')i++;w.push(c);c='';r.push(w);w=[]}else c+=h}if(c||w.length){w.push(c);r.push(w)}return r.filter(x=>x.some(y=>y.trim()))}
const FIELDS=[['name','Business name *',['name','business','company','title']],['phone','Phone / WhatsApp',['phone','mobile','whatsapp','tel','contact']],['email','Email',['email']],['website','Website / link',['website','url','site','web']],['location','Location',['location','address','area','city']],['niche','Niche / category',['niche','category','type']],['source','Source',['source']],['notes','Notes',['notes','note','comment']]];
let pend=null;const last9=p=>String(p||'').replace(/\D/g,'').slice(-9);
function startImport(t,fn){t=t.replace(/^\uFEFF/,'');const first=t.split(/\r?\n/)[0],d=[',',';','\t'].map(c=>[c,first.split(c).length]).sort((a,b)=>b[1]-a[1])[0][0],r=parseCsv(t,d);if(r.length<2)throw 0;
const h=r.shift().map(x=>x.trim());pend={r};
const auto=a=>{for(const m of a){const i=h.findIndex(x=>x.toLowerCase()===m);if(i>-1)return i}for(const m of a){const i=h.findIndex(x=>x.toLowerCase().includes(m));if(i>-1)return i}return-1};
$('#dbody').innerHTML=`<h2>Import ${esc(fn)}</h2><p class="meta">${r.length} rows found. Check that each field points at the right column.</p><div class="g">${FIELDS.map(([k,lab,al])=>{const a=auto(al);return`<label>${lab}<select data-map="${k}"><option value="-1">Skip</option>${h.map((x,i)=>`<option value="${i}" ${i===a?'selected':''}>${esc(x||'(blank)')}</option>`).join('')}</select></label>`}).join('')}</div><div class="row" style="margin-top:14px"><button class="btn pri" id="impgo">Import ${r.length} rows</button><button class="btn" id="cl">Cancel</button></div>`;
if(!$('#dlg').open)$('#dlg').showModal()}
function doImport(){const m={};document.querySelectorAll('[data-map]').forEach(s=>m[s.dataset.map]=+s.value);
if(m.name<0){toast('Choose which column holds the business name');return}
let add=0,dup=0,nn=0;pend.r.forEach(w=>{const g=k=>m[k]>-1?String(w[m[k]]||'').trim():'',name=g('name'),phone=g('phone');
if(!name){nn++;return}
if(db.leads.some(l=>l.name.toLowerCase()===name.toLowerCase()||(last9(phone).length===9&&last9(l.phone)===last9(phone)))){dup++;return}
db.leads.push({id:uid(),name,niche:g('niche'),phone,email:g('email'),website:g('website'),location:g('location'),source:g('source'),status:'new',next:'',notes:g('notes'),created:Date.now(),log:[]});add++});
persist();render();
$('#dbody').innerHTML=`<h2>Import finished</h2><p><b>${add}</b> leads added.<br>${dup} skipped as duplicates.<br>${nn} rows skipped because they had no name.</p><button class="btn pri" id="cl">Done</button>`}
$('#imp').onchange=async e=>{const fl=e.target.files[0];e.target.value='';if(!fl)return;
try{const tx=await fl.text();if(/\.json$/i.test(fl.name)){const d=JSON.parse(tx);if(!Array.isArray(d.leads))throw 0;if(!confirm('Replace all current data with this backup?'))return;db=Object.assign({tpl:db.tpl,tplNew:db.tplNew,lastBackup:null},d);fixS();persist();render();toast('Backup restored')}
else startImport(tx,fl.name)}catch(x){toast('Could not read that file. Use a .json backup or a .csv with a header row.')}};
$('#impb').onclick=()=>$('#imp').click();
boot();
</script></body></html>
